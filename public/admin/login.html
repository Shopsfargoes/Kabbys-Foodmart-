<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login | Kabby’s Foodmart</title>
<link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="admin.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body><main class="card narrow">
  <h1>Admin login</h1>
  <form id="lf">
    <label>Email<input id="email" type="email" autocomplete="username" required></label>
    <label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Sign in</button>
    <p id="msg" role="alert" class="msg"></p>
  </form>
</main>
<script type="module" src="../js/admin/login.js"></script></body></html>
