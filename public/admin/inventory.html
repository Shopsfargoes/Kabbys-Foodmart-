<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory | Admin</title>
<link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="admin.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body><main>
<section class="card detail" id="panel" hidden></section>
<section class="card">
  <h2>Inventory</h2>
  <div class="tabs" id="tabs" role="group" aria-label="Stock filters"></div>
  <input class="search" id="q" type="search" placeholder="Search products" aria-label="Search products" maxlength="60">
  <div class="wrap"><table>
    <thead><tr><th>Product</th><th>In stock</th><th>Alert at</th><th>Status</th><th></th></tr></thead>
    <tbody id="rows"></tbody></table></div>
  <p class="msg" id="empty"></p>
</section>
</main>
<script type="module" src="../js/admin/inventory.js"></script></body></html>
