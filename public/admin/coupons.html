<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coupons | Admin</title>
<link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="admin.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body><main>
<section class="card"><h2>Create coupon</h2>
  <form id="cf" novalidate>
    <div class="grid2">
      <label>Code (letters, numbers, - _)<input id="code" maxlength="30" required></label>
      <label>Type<select id="type"><option value="percent">Percentage (%)</option><option value="flat">Flat (₦)</option></select></label>
      <label>Value<input id="value" type="number" min="0.01" step="0.01" required></label>
      <label>Max discount ₦ (percent only)<input id="maxd" type="number" min="1" step="0.01"></label>
      <label>Minimum order ₦<input id="minOrder" type="number" min="0" step="0.01" value="0"></label>
      <label>Max total uses (blank = unlimited)<input id="maxUses" type="number" min="1" step="1"></label>
      <label>Starts (optional)<input id="starts" type="datetime-local"></label>
      <label>Ends (optional)<input id="ends" type="datetime-local"></label>
    </div>
    <label>Note (internal)<input id="note" maxlength="120"></label>
    <label class="row"><input id="once" type="checkbox" checked> One use per customer (by email)</label>
    <p><button class="btn" type="submit">Create coupon</button></p>
    <p class="msg" id="msg" role="status"></p>
  </form></section>
<section class="card"><h2>Coupons</h2><div class="wrap"><table>
  <thead><tr><th>Code</th><th>Discount</th><th>Min order</th><th>Used</th><th>Expires</th><th></th></tr></thead>
  <tbody id="rows"></tbody></table></div></section>
</main>
<script type="module" src="../js/admin/coupons.js"></script></body></html>
