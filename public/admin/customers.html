<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customers | Admin</title>
<link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="admin.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body><main>
<section class="card detail" id="detail" hidden></section>
<section class="card">
  <h2>Customers</h2>
  <div class="actions-row">
    <input class="search" id="q" type="search" placeholder="Search name, email or phone" aria-label="Search customers" maxlength="60">
    <select id="sort" aria-label="Sort customers">
      <option value="new">Newest</option><option value="spend">Highest spend</option><option value="orders">Most orders</option>
    </select>
  </div>
  <div class="wrap"><table>
    <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Orders</th><th>Total spent</th><th>Last order</th></tr></thead>
    <tbody id="rows"></tbody></table></div>
  <p class="msg" id="empty"></p>
</section>
</main>
<script type="module" src="../js/admin/customers.js"></script></body></html>
